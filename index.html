<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#000000">
    <link rel="manifest" href="/manifest.json">
    <link rel="icon" type="image/png" href="logo512.png">

    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="One To Another">
    <title>NameDrop Real File Share</title>
    <style>
        :root {
            --bg: #050507;
            --card-bg: rgba(28, 28, 30, 0.75);
            --accent: #0A84FF;
            --success: #34C759;
            --text: #F5F5F7;
            --text-secondary: #8E8E93;
            --border: rgba(255, 255, 255, 0.12);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 40px 20px;
            overflow-x: hidden;
        }

        header {
            text-align: center;
            z-index: 10;
        }

        header h1 {
            font-size: 26px;
            font-weight: 600;
            letter-spacing: -0.5px;
            margin-bottom: 4px;
        }

        header p {
            font-size: 14px;
            color: var(--text-secondary);
        }

        /* Stage layout for NameDrop Effect */
        .stage {
            position: relative;
            width: 100%;
            max-width: 500px;
            height: 380px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .phones-container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* NameDrop Flare Glow Effect at the top matching */
        .flare-glow {
            position: absolute;
            width: 160px;
            height: 160px;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.8) 0%, rgba(10, 132, 255, 0.4) 40%, transparent 70%);
            top: 25%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0);
            border-radius: 50%;
            pointer-events: none;
            z-index: 6;
            transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.6s ease;
            opacity: 0;
        }

        .phones-container.connected .flare-glow {
            transform: translate(-50%, -50%) scale(1.6);
            opacity: 1;
            animation: pulseFlare 2s infinite alternate;
        }

        @keyframes pulseFlare {
            0% { transform: translate(-50%, -50%) scale(1.5); opacity: 0.8; }
            100% { transform: translate(-50%, -50%) scale(1.8); opacity: 1; filter: drop-shadow(0 0 20px #0A84FF); }
        }

        /* Phone Styling */
        .phone {
            position: absolute;
            width: 140px;
            height: 270px;
            background: #1c1c1e;
            border-radius: 28px;
            border: 4px solid #3a3a3c;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.7);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 12px 8px;
            transition: transform 0.9s cubic-bezier(0.16, 1, 0.3, 1), border-color 0.4s ease, box-shadow 0.4s ease;
        }

        .notch {
            width: 45px;
            height: 11px;
            background: #000;
            border-radius: 5.5px;
            margin-bottom: 12px;
        }

        .phone-screen {
            flex: 1;
            width: 100%;
            background: linear-gradient(145deg, #161618, #0a0a0c);
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 10px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        /* Initial Open Positions (Separated) */
        .phone.local {
            transform: translateY(20px) translateX(-80px) rotate(-8deg);
            z-index: 2;
        }

        .phone.remote {
            transform: translateY(20px) translateX(80px) rotate(8deg);
            z-index: 1;
        }

        /* NameDrop Connected Position: Tops overlapping closely like real Apple NameDrop */
        .phones-container.connected .phone.local {
            transform: translateY(-10px) translateX(-28px) rotate(-2deg) scale(1.03);
            border-color: var(--accent);
            box-shadow: 0 0 35px rgba(10, 132, 255, 0.5), 0 20px 40px rgba(0,0,0,0.8);
        }

        .phones-container.connected .phone.remote {
            transform: translateY(-10px) translateX(28px) rotate(2deg) scale(1.03);
            border-color: var(--accent);
            box-shadow: 0 0 35px rgba(10, 132, 255, 0.5), 0 20px 40px rgba(0,0,0,0.8);
        }

        /* Dashboard controls */
        .dashboard {
            width: 100%;
            max-width: 420px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            z-index: 10;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            padding: 16px;
            border-radius: 18px;
            backdrop-filter: blur(25px);
            text-align: center;
        }

        .btn {
            background-color: var(--accent);
            color: #ffffff;
            border: none;
            padding: 14px 20px;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            width: 100%;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn:hover { background-color: #0071e3; transform: translateY(-1px); }
        .btn:disabled { background-color: #3a3a3c; color: var(--text-secondary); cursor: not-allowed; }

        input[type="file"] { display: none; }

        .status-text {
            font-size: 14px;
            color: var(--text-secondary);
            text-align: center;
            margin-top: 6px;
        }

        progress {
            width: 100%;
            height: 8px;
            border-radius: 4px;
            appearance: none;
            margin-top: 10px;
            overflow: hidden;
        }

        progress::-webkit-progress-bar { background-color: #2c2c2e; }
        progress::-webkit-progress-value { background-color: var(--success); transition: width 0.1s linear; }

        svg { width: 18px; height: 18px; fill: currentColor; }
    </style>
</head>
<body>

    <header>
        <h1>NameDrop Share</h1>
        <p>Bring devices together for real wireless P2P file transfers</p>
    </header>

    <!-- NameDrop Animation Stage -->
    <div class="stage">
        <div class="phones-container" id="phonesContainer">
            <div class="flare-glow"></div>

            <!-- Local Device -->
            <div class="phone local">
                <div class="notch"></div>
                <div class="phone-screen">
                    <svg style="width:28px;height:28px;fill:var(--accent);margin-bottom:6px;" viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 0 10 10A10 10 0 0 0 12 2zm0 18a8 8 0 1 1 8-8 8 8 0 0 1-8 8zm1-13h-2v6h6v-2h-4z"/></svg>
                    <div style="font-size:12px; font-weight:600;" id="localRole">My Device</div>
                    <div style="font-size:10px; color:var(--text-secondary); margin-top:2px;" id="localState">Searching...</div>
                </div>
            </div>

            <!-- Remote Peer Device -->
            <div class="phone remote">
                <div class="notch"></div>
                <div class="phone-screen">
                    <svg style="width:28px;height:28px;fill:var(--text-secondary);margin-bottom:6px;" viewBox="0 0 24 24"><path d="M17 1.01L7 1c-1.1 0-2 .9-2 2v18c0 1.1.9 2 2 2h10c1.1 0 2-.9 2-2V3c0-1.1-.9-1.99-2-1.99zM17 19H7V5h10v14z"/></svg>
                    <div style="font-size:12px; font-weight:600;">Nearby Peer</div>
                    <div style="font-size:10px; color:var(--text-secondary); margin-top:2px;" id="remoteState">Waiting...</div>
                </div>
            </div>
        </div>
    </div>

    <!-- Controls Dashboard -->
    <div class="dashboard">
        <div class="card">
            <input type="file" id="fileInput">
            <button class="btn" id="selectBtn" disabled>Waiting for Proximity Connection...</button>
        </div>

        <div id="transferCard" class="card" style="display:none;">
            <div style="font-size: 13px; display:flex; justify-content:space-between; margin-bottom:6px;">
                <span id="fileNameDisplay" style="font-weight: 500;">filename.ext</span>
                <span id="filePercentage" style="color: var(--accent);">0%</span>
            </div>
            <progress id="transferProgress" value="0" max="100"></progress>
        </div>

        <div class="status-text" id="statusMessage">Initializing secure wireless mesh channel...</div>
    </div>

    <footer>
        <p style="font-size: 11px; color: var(--text-secondary);">Apple NameDrop UI Animation & WebRTC P2P Protocol</p>
    </footer>

    <script>
        // Free public signaling channel for real auto-discovery across network/tabs
        const ROOM_ID = "namedrop-secure-mesh-room-445566";
        const ws = new WebSocket(`wss://socketsbay.com/wss/v2/1/demo/`);

        let pc, dataChannel;
        let isInitiator = false;
        let selectedFile = null;

        const configuration = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] };

        const phonesContainer = document.getElementById('phonesContainer');
        const selectBtn = document.getElementById('selectBtn');
        const fileInput = document.getElementById('fileInput');
        const statusMessage = document.getElementById('statusMessage');
        const localState = document.getElementById('localState');
        const remoteState = document.getElementById('remoteState');
        const transferCard = document.getElementById('transferCard');
        const transferProgress = document.getElementById('transferProgress');
        const filePercentage = document.getElementById('filePercentage');
        const fileNameDisplay = document.getElementById('fileNameDisplay');

        ws.onopen = () => {
            ws.send(JSON.stringify({ type: 'join', room: ROOM_ID }));
            statusMessage.textContent = "Looking for nearby devices...";
            
            // Assign roles automatically for demo connection
            setTimeout(() => {
                isInitiator = true;
                document.getElementById('localRole').textContent = "Sender";
                initPeerConnection(true);
            }, 800);
        };

        ws.onmessage = async (event) => {
            const message = JSON.parse(event.data);
            if (!pc) initPeerConnection(false);

            if (message.type === 'offer') {
                await pc.setRemoteDescription(new RTCSessionDescription(message.offer));
                const answer = await pc.createAnswer();
                await pc.setLocalDescription(answer);
                ws.send(JSON.stringify({ type: 'answer', answer: answer }));
            } else if (message.type === 'answer') {
                await pc.setRemoteDescription(new RTCSessionDescription(message.answer));
            } else if (message.type === 'candidate') {
                if (message.candidate) await pc.addIceCandidate(new RTCIceCandidate(message.candidate));
            }
        };

        function initPeerConnection(initiator) {
            pc = new RTCPeerConnection(configuration);

            pc.onicecandidate = (e) => {
                if (e.candidate) {
                    ws.send(JSON.stringify({ type: 'candidate', candidate: e.candidate }));
                }
            };

            if (initiator) {
                dataChannel = pc.createDataChannel("namedrop-transfer");
                setupDataChannel();
                pc.createOffer().then(offer => {
                    pc.setLocalDescription(offer);
                    ws.send(JSON.stringify({ type: 'offer', offer: offer }));
                });
            } else {
                pc.ondatachannel = (e) => {
                    dataChannel = e.channel;
                    setupDataChannel();
                };
            }
        }

        function setupDataChannel() {
            dataChannel.onopen = () => {
                // Trigger NameDrop Animation: Glow flare + Phones locking top-to-top
                phonesContainer.classList.add('connected');
                statusMessage.textContent = "NameDrop Connection Established! Ready to share files.";
                localState.textContent = "Connected";
                remoteState.textContent = "Connected";
                selectBtn.disabled = false;
                selectBtn.textContent = "Select File to Send via NameDrop";
            };

            dataChannel.onclose = () => {
                phonesContainer.classList.remove('connected');
                statusMessage.textContent = "Devices moved apart. Connection closed.";
                localState.textContent = "Disconnected";
                remoteState.textContent = "Disconnected";
            };

            let incomingMeta = {}, buffer = [], receivedBytes = 0;
            dataChannel.onmessage = async (e) => {
                if (typeof e.data === 'string') {
                    incomingMeta = JSON.parse(e.data);
                    buffer = [];
                    receivedBytes = 0;
                    transferCard.style.display = 'block';
                    fileNameDisplay.textContent = incomingMeta.name;
                    statusMessage.textContent = `Receiving "${incomingMeta.name}" via NameDrop beam...`;
                } else {
                    buffer.push(e.data);
                    receivedBytes += e.data.byteLength;
                    let pct = Math.round((receivedBytes / incomingMeta.size) * 100);
                    transferProgress.value = pct;
                    filePercentage.textContent = `${pct}%`;

                    if (receivedBytes === incomingMeta.size) {
                        const blob = new Blob(buffer);
                        const url = URL.createObjectURL(blob);
                        const a = document.createElement('a');
                        a.href = url;
                        a.download = incomingMeta.name;
                        a.click();
                        statusMessage.textContent = `Successfully received "${incomingMeta.name}"! 🎉`;
                    }
                }
            };
        }

        selectBtn.onclick = () => fileInput.click();
        
        fileInput.onchange = (e) => {
            const file = e.target.files[0];
            if (!file) return;

            transferCard.style.display = 'block';
            fileNameDisplay.textContent = file.name;
            selectBtn.textContent = "Sending File...";
            selectBtn.disabled = true;

            dataChannel.send(JSON.stringify({ type: 'meta', name: file.name, size: file.size }));

            const chunkSize = 16384;
            const reader = new FileReader();
            let offset = 0;

            reader.onload = (e) => {
                dataChannel.send(e.target.result);
                offset += e.target.result.byteLength;
                let pct = Math.round((offset / file.size) * 100);
                transferProgress.value = pct;
                filePercentage.textContext = `${pct}%`;

                if (offset < file.size) {
                    readNext();
                } else {
                    statusMessage.textContent = `Successfully sent "${file.name}"! ✓`;
                    selectBtn.textContent = "File Sent Successfully";
                }
            };

            function readNext() {
                const slice = file.slice(offset, offset + chunkSize);
                reader.readAsArrayBuffer(slice);
            }
            readNext();
        };
    </script>
</body>
</html>
