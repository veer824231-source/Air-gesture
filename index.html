<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap');

:root {
  --energy: 0;
  --scale: 1;
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  min-height: 100vh;
  background: #f7f6f3;
  color: #242424;
  font-family: 'DM Sans', sans-serif;
  overflow: hidden;
}

.app {
  width: 100%;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  position: relative;
  padding: 25px;
}

.top {
  position: absolute;
  top: 28px;
  left: 35px;
  right: 35px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.logo {
  font-size: 19px;
  font-weight: 700;
  letter-spacing: 2px;
}

.logo span {
  color: #a3a09b;
  font-weight: 400;
}

.status {
  font-size: 12px;
  color: #99948e;
  display: flex;
  align-items: center;
  gap: 8px;
}

.dot {
  height: 7px;
  width: 7px;
  border-radius: 50%;
  background: #bbb;
  transition: .3s;
}

.dot.active {
  background: #65c99b;
  box-shadow: 0 0 12px #65c99b;
}

.center {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  width: 100%;
  transform: translateY(-10px);
}

/* ORB */

.orb-container {
  width: min(290px, 68vw);
  aspect-ratio: 1;
  position: relative;
  display: grid;
  place-items: center;
  isolation: isolate;
  transform: scale(var(--scale));
  transition: transform .12s ease-out;
}

.orb-glow {
  position: absolute;
  inset: 4%;
  border-radius: 50%;
  background: conic-gradient(
    from 0deg,
    #3F48CC,
   #C9A365,
    #E09C99,
    #A295D9,
   #07D1B3,
   #0C589C,
    #a4e9c2
  );
  filter: blur(32px);
  opacity: .32;
  transform: scale(1.12);
  animation: glow 8s ease-in-out infinite alternate;
}

.orb {
  width: 100%;
  height: 100%;
  border-radius: 50%;
  position: relative;
  overflow: hidden;
  isolation: isolate;
  background:
    radial-gradient(ellipse at 26% 25%, rgba(255,255,255,.95), transparent 15%),
    radial-gradient(ellipse at 76% 20%, #b3e6a0 0%, transparent 15%),
    radial-gradient(ellipse at 82% 70%, #61d9bd 0%, transparent 15%),
    radial-gradient(ellipse at 23% 77%, #f4bd83 0%, transparent 15%),
    radial-gradient(ellipse at 48% 45%, #f9d2b7 0%, transparent 25%),
    linear-gradient(135deg,#f3c98c,#f2b3b6,#9ddfca,#9edbd4);
  box-shadow:
    inset -12px -15px 30px rgba(48,145,127,.12),
    inset 10px 10px 30px rgba(255,255,255,.75),
    0 18px 55px rgba(174,170,153,.16);
  animation: float 7s ease-in-out infinite;
}

/* Moving liquid color layers */

.liquid {
  position: absolute;
  inset: -20%;
  border-radius: 45%;
  filter: blur(23px);
  mix-blend-mode: screen;
  opacity: .75;
  will-change: transform;
}

.liquid.one {
  background:
    radial-gradient(ellipse at 30% 30%, #fff1d9 0%, transparent 8%),
    radial-gradient(ellipse at 65% 65%, #79e6c0 0%, transparent 2%);
  animation: liquidOne 9s ease-in-out infinite alternate;
}

.liquid.two {
  background:
    radial-gradient(ellipse at 70% 25%, #9be8a0 0%, transparent 4%),
    radial-gradient(ellipse at 25% 70%, #f7a7a5 0%, transparent 4%);
  animation: liquidTwo 11s ease-in-out infinite alternate;
}

.liquid.three {
  background:
    radial-gradient(ellipse at 50% 40%, rgba(255,255,255,.9), transparent 5%),
    radial-gradient(ellipse at 70% 80%, #67d8d0, transparent 4%);
  animation: liquidThree 8s ease-in-out infinite alternate;
}

/* Soft glass highlights */

.orb::before {
  content: "";
  position: absolute;
  inset: 0;
  z-index: 4;
  border-radius: inherit;
  background:
    radial-gradient(ellipse at 27% 17%,
      rgba(255,255,255,.82), transparent 23%),
    radial-gradient(ellipse at 50% 110%,
      rgba(255,255,255,.15), transparent 48%);
  pointer-events: none;
}

.orb::after {
  content: "";
  position: absolute;
  inset: 2px;
  border-radius: inherit;
  border: 1px solid rgba(255,255,255,.42);
  z-index: 5;
  pointer-events: none;
}

.orb-container.listening .orb {
  animation: float 4s ease-in-out infinite, listening 1.8s ease-in-out infinite;
}

.orb-container.speaking .orb {
  animation: float 3s ease-in-out infinite, speaking 1.15s ease-in-out infinite;
}

.orb-container.listening .orb-glow {
  opacity: .52;
}

.orb-container.speaking .orb-glow {
  opacity: .7;
  animation-duration: 2s;
}

@keyframes float {
  0%,100% { transform: translateY(0) rotate(0deg); }
  50% { transform: translateY(-7px) rotate(2deg); }
}

@keyframes listening {
  0%,100% { border-radius: 50%; }
  50% { border-radius: 47% 53% 51% 49% / 52% 47% 53% 48%; }
}

@keyframes speaking {
  0%,100% { border-radius: 50%; }
  50% { border-radius: 48% 52% 47% 53% / 53% 46% 54% 47%; }
}

@keyframes glow {
  from { transform: scale(1.08); filter: blur(25px); }
  to { transform: scale(1.22); filter: blur(38px); }
}

@keyframes liquidOne {
  0% { transform: translate(-7%, -5%) rotate(0deg) scale(1); }
  100% { transform: translate(10%, 9%) rotate(90deg) scale(1.15); }
}

@keyframes liquidTwo {
  0% { transform: translate(8%, 5%) rotate(0deg) scale(1.1); }
  100% { transform: translate(-10%, -8%) rotate(-100deg) scale(.95); }
}

@keyframes liquidThree {
  0% { transform: translate(-5%, 10%) scale(1); }
  100% { transform: translate(9%, -7%) scale(1.2); }
}

/* TEXT */

.assistant-name {
  margin-top: 39px;
  font-size: 19px;
  font-weight: 600;
  letter-spacing: -.5px;
}

.subtitle {
  margin-top: 8px;
  font-size: 13px;
  color: #9b9892;
  text-align: center;
}

.response {
  margin-top: 24px;
  min-height: 44px;
  max-width: 440px;
  text-align: center;
  font-size: 14px;
  line-height: 1.6;
  color: #77736e;
  padding: 0 10px;
}

/* CONTROLS */

.controls {
  display: flex;
  align-items: center;
  gap: 14px;
  margin-top: 26px;
}

.control {
  width: 54px;
  height: 54px;
  border: 1px solid #e9e6e0;
  background: rgba(255,255,255,.75);
  border-radius: 50%;
  display: grid;
  place-items: center;
  cursor: pointer;
  color: #55514c;
  transition: .25s;
}

.control:hover {
  transform: translateY(-3px);
  background: white;
  box-shadow: 0 8px 25px rgba(0,0,0,.07);
}

.control svg {
  width: 21px;
  height: 21px;
}

.control.main {
  width: 65px;
  height: 65px;
  background: #252525;
  color: white;
  border: none;
  box-shadow: 0 8px 24px rgba(0,0,0,.13);
}

.control.main:hover {
  transform: scale(1.06);
}

.control.main.listening {
  background: #d96f70;
}

.bottom {
  position: absolute;
  bottom: 25px;
  font-size: 11px;
  color: #aaa59e;
  letter-spacing: .2px;
}

@media(max-width:600px) {
  .top {
    top: 22px;
    left: 22px;

  .orb-container {

  }

  .assistant-name {

  }

  .subtitle {
    font-size: 12px;
  }

  .response {
    font-size: 13px;
    max-width: 320px;
  }

  .bottom {
    bottom: 19px;
  }
}

@media(prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: .01ms !important;
    transition-duration: .01ms !important;
  }
}

<body>

<div class="app">

        <button type="button" id="musicNext" aria-label="Next track"><svg viewBox="0 0 24 24" width="17" height="17" fill="currentColor" aria-hidden="true"><path d="M15.8 5H18v14h-2.2z"/><path d="M4 5.2v13.6L14.8 12z"/></svg></button>

<script>
const orbContainer = document.getElementById("orbContainer");
const responseBox = document.getElementById("response");
const statusText = document.getElementById("statusText");
const subtitle = document.getElementById("subtitle");
const dot = document.getElementById("dot");
const micBtn = document.getElementById("micBtn");

let recognition;
let listening = false;
let muted = false;
let speaking = false;
let audioContext;
let analyser;
let microphone;
let micStream = null;
let micRequestPromise = null;
let micPermissionDenied = false;
let animationFrame;
let restartTimer;
let userName = "";
let lastTopic = "";
let visualState = "idle";
let audioEnergy = 0;

// ===== Music engine: YouTube (full songs) with iTunes 30s preview fallback =====
let ytPlayer=null,ytReadyPromise=null,ytApiPromise=null,ytWatchdog=null,ytFailCount=0;
let musicQueue=[],musicIndex=0,musicPlaying=false,musicVolume=65,musicSearchBusy=false,lastMusicQuery="",audioUnlocked=false;
const musicAudio=new Audio();musicAudio.preload="auto";
const musicPanel=document.getElementById("musicPanel");
const musicTitle=document.getElementById("musicTitle");
const musicArtist=document.getElementById("musicArtist");
const musicToggle=document.getElementById("musicToggle");
const musicVolumeInput=document.getElementById("musicVolume");
const ICON_PLAY=`<svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor" aria-hidden="true"><path d="M8 5.2v13.6L19.5 12z"/></svg>`,ICON_PAUSE=`<svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor" aria-hidden="true"><rect x="6" y="5" width="4.2" height="14" rx="1.3"/><rect x="13.8" y="5" width="4.2" height="14" rx="1.3"/></svg>`;
const curTrack=()=>musicQueue[musicIndex];
function setMusicUI(p){musicPlaying=p;musicPanel.classList.add("visible");musicPanel.classList.toggle("playing",p);musicToggle.innerHTML=p?ICON_PAUSE:ICON_PLAY;}
function applyVolume(){musicVolumeInput.value=musicVolume;document.getElementById("volumeValue").textContent=musicVolume+"%";musicAudio.volume=musicVolume/100;try{if(ytPlayer&&ytPlayer.setVolume)ytPlayer.setVolume(musicVolume);}catch(e){}}
function changeMusicVolume(d){musicVolume=Math.max(0,Math.min(100,musicVolume+d));applyVolume();}
function fetchJSON(url,ms){const c=new AbortController(),t=setTimeout(()=>c.abort(),ms);return fetch(url,{signal:c.signal}).then(r=>{if(!r.ok)throw new Error("bad");return r.json();}).finally(()=>clearTimeout(t));}
function nonEmpty(r){if(!r.length)throw new Error("empty");return r;}

function loadYouTubeAPI(){
  if(ytApiPromise)return ytApiPromise;
  ytApiPromise=new Promise((resolve,reject)=>{
    if(window.YT&&window.YT.Player){resolve();return;}
    const old=window.onYouTubeIframeAPIReady;
    window.onYouTubeIframeAPIReady=()=>{if(typeof old==="function")old();resolve();};
    const s=document.createElement("script");s.src="https://www.youtube.com/iframe_api";
    s.onerror=()=>reject(new Error("yt api"));document.head.appendChild(s);
    setTimeout(()=>reject(new Error("yt api timeout")),12000);
  }).catch(e=>{ytApiPromise=null;throw e;});
  return ytApiPromise;
}
function ensureYouTubePlayer(){
  if(ytReadyPromise)return ytReadyPromise;
  ytReadyPromise=loadYouTubeAPI().then(()=>new Promise((resolve,reject)=>{
    const vars={autoplay:1,controls:0,disablekb:1,playsinline:1,rel:0,iv_load_policy:3};
    if(location.protocol.startsWith("http"))vars.origin=location.origin;
    setTimeout(()=>reject(new Error("yt init timeout")),15000);
    new YT.Player("ytPlayerHost",{width:200,height:200,playerVars:vars,events:{
      onReady:e=>{ytPlayer=e.target;applyVolume();resolve(ytPlayer);},
      onStateChange:e=>{
        if(!curTrack()||curTrack().src!=="yt")return;
        if(e.data===1){ytFailCount=0;setMusicUI(true);}
        else if(e.data===2)setMusicUI(false);
        else if(e.data===0)playNextTrack();
      },
      onError:()=>{

/* REAL MICROPHONE REACTIVITY */

async function setupAudio() {
  // Reuse one microphone stream for the entire page session.
  if (micPermissionDenied) throw new Error("Microphone permission was denied.");
  if (!micStream) {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      throw new Error("Microphone requires HTTPS or localhost.");
    }
    if (!micRequestPromise) {
      micRequestPromise = navigator.mediaDevices.getUserMedia({
        audio: { echoCancellation:true, noiseSuppression:true, autoGainControl:true }
      }).then(stream => {
        micStream = stream;
        return stream;
      }).catch(error => {
        if (error && (error.name === "NotAllowedError" || error.name === "PermissionDeniedError")) {
          micPermissionDenied = true;
        }
        micRequestPromise = null;
        throw error;
      });
    }
    await micRequestPromise;
  }

  const AudioContextClass = window.AudioContext || window.webkitAudioContext;
  if (!AudioContextClass) return;
  if (!audioContext) {
    audioContext = new AudioContextClass();
    analyser = audioContext.createAnalyser();
    analyser.fftSize = 512;
    analyser.smoothingTimeConstant = 0.84;
    microphone = audioContext.createMediaStreamSource(micStream);
    microphone.connect(analyser);
  }
  if (audioContext.state === "suspended") await audioContext.resume();
  animateOrb();
}

function animateOrb() {
  if (!analyser) return;
  const data = new Uint8Array(analyser.frequencyBinCount);
  function frame() {
    if (!analyser) return;
    analyser.getByteFrequencyData(data);
    let weighted=0;
    for(let i=0;i<data.length;i++) weighted+=data[i]*(i<data.length*.55?1.25:.75);
    const volume=weighted/(data.length*255);
    audioEnergy += ((listening ? Math.min(volume,.95) : 0)-audioEnergy)*.22;
    const scale=1+audioEnergy*.17;
    orbContainer.style.transform=`scale(${scale})`;
    document.querySelector(".orb-glow").style.opacity=String(.34+audioEnergy*.62);
    animationFrame=requestAnimationFrame(frame);
  }
  cancelAnimationFrame(animationFrame);
  frame();
}

if (SpeechRecognition) {
  recognition = new SpeechRecognition();
  recognition.lang = "en-IN";

  recognition.onstart = () => {
    listening = true;

  };

  recognition.onresult = (event) => {
    let finalText = "";

    for (let i = event.resultIndex; i < event.results.length; i++) {
      if (event.results[i].isFinal) {
        finalText += event.results[i][0].transcript;
      }
    }

    if (finalText.trim()) {
      handleInput(finalText.trim());
    }
  };

  recognition.onerror = (event) => {
    if (event.error === "not-allowed") {
      responseBox.textContent = "Please allow microphone access in your browser.";
      stopListening();
    } else if (event.error === "audio-capture") {
      responseBox.textContent = "No microphone found or it is busy.";
      stopListening();
    }
  };

  recognition.onend = () => {
    if (listening && !speaking) {
      clearTimeout(restartTimer);
      restartTimer = setTimeout(() => {
        try { recognition.start(); } catch (e) {}
      }, 350);
    }
  };
}

/* VOICE OUTPUT */

function speak(text) {
  if (muted) {
    responseBox.textContent = text;
    setState(listening ? "listening" : "idle");
    return;
  }

  if (!("speechSynthesis" in window)) {
    responseBox.textContent = text;
    return;
  }

  speechSynthesis.cancel();
  const resumeMic = listening;
  speaking = true;
  listening = false;

  if (recognition) {
    try { recognition.stop(); } catch(e) {}
  }

  setState("speaking");
  responseBox.textContent = text;

  const utterance = new SpeechSynthesisUtterance(text);
  utterance.lang = /[\u0900-\u097F]/.test(text) ? "hi-IN" : "en-IN";
  utterance.rate = 1;
  utterance.pitch = 1.02;
  utterance.volume = 1;
  if(utterance.lang==="hi-IN"){const hv=speechSynthesis.getVoices().find(v=>/^hi/i.test(v.lang));if(hv)utterance.voice=hv;}else if(window.auraVoice) utterance.voice=window.auraVoice;

  utterance.onend = () => {
    speaking = false;
    if (resumeMic||window.auraBarge) { window.auraBarge=false; startRecognition(); }
    else setState("idle");
  };

  utterance.onerror = () => {
    speaking = false;
    if (resumeMic||window.auraBarge) { window.auraBarge=false; startRecognition(); }
    else setState("idle");
  };

  speechSynthesis.speak(utterance);
}

    return "Hello! It's good to hear from you. What would you like to talk about?";
  }

  if (t.includes("my name is")) {
    userName = input.split(/my name is/i)[1]?.trim().split(" ")[0] || "";
    return "Nice to meet you " + userName + ". I'll call you that during this conversation.";
  }

  if (t.includes("what is my name") || t.includes("do you know my name")) {
    return userName
      ? "Your name is " + userName + "."
      : "You haven't told me your name yet.";
  }

  if (/\bhow are you\b/.test(t)) {
    return "I'm doing great! I'm ready to talk and help you. How are you?";
  }

  if (/\bwho are you\b|\bwhat are you\b/.test(t)) {
    return "I'm AURA, your personal voice assistant. I can chat, answer some questions, tell jokes and help with everyday things.";
  }

  if (/\bthank you\b|\bthanks\b/.test(t)) {
    return "You're welcome! I'm always happy to help.";
  }

  if (/\bgood morning\b/.test(t)) {
    return "Good morning! I hope you have a wonderful day.";
  }

  if (/\bgood night\b/.test(t)) {
    return "Good night! Have a peaceful sleep.";
  }

  if (/\bi am fine\b|\bi am good\b|\bdoing good\b/.test(t)) {
    return "That's wonderful. So, what shall we talk about?";
  }

  if (/\bi am sad\b|\bi feel sad\b|\bi am upset\b/.test(t)) {
    return "I'm sorry you're feeling that way. Want to tell me what happened? I'm here to listen.";
  }

  if (/\bi am happy\b|\bi feel happy\b/.test(t)) {
    return "That's amazing! I hope your happiness lasts all day.";
  }

  if (/\bi am bored\b|\bboring\b/.test(t)) {
    return "Let's make things interesting. We can play a quiz, talk about technology or hear a joke.";
  }

  if (/\btell me a joke\b|\bmake me laugh\b|\bjoke\b/.test(t)) {
    const jokes = [
      "Why did the computer go to the doctor? Because it had a virus.",
      "Why was the maths book sad? Because it had too many problems.",
      "Why do programmers prefer dark mode? Because light attracts bugs.",
      "What did one wall say to the other wall? I'll meet you at the corner."
    ];
    return jokes[Math.floor(Math.random() * jokes.length)];
  }

  if (/\btime\b/.test(t) && !t.includes("time travel")) {
    return "The current time is " +
      new Date().toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"}) + ".";
  }

  if (/\bdate\b|\bday is it\b/.test(t)) {
    return "Today is " +
      new Date().toLocaleDateString("en-IN", {
        weekday:"long", day:"numeric", month:"long", year:"numeric"
      }) + ".";
  }

  if (/\bwho made you\b|\bwho created you\b/.test(t)) {
    return "I was created as a browser-based voice assistant using HTML, CSS and JavaScript.";
  }

  if (/\bweather\b/.test(t)) {
    return "I can't access live weather information in this offline version. You can check your local weather app for the latest forecast.";
  }

  if (/\bwhat can you do\b|\bhelp me\b/.test(t)) {
    return "You can ask me simple questions, talk about your day, ask for jokes, basic calculations, time, date, study help and technology topics.";
  }

  if (/\bscience\b|\bphysics\b/.test(t)) {
    lastTopic = "science";
    return "Science is the study of the natural world. Physics is the branch that studies matter, energy, force and motion. What would you like to know?";
  }

  if (/\bspace\b|\bplanet\b|\bsolar system\b/.test(t)) {
    lastTopic = "space";
    return "Space is fascinating. Our solar system has eight planets, and the Sun is at its centre. Which planet interests you most?";
  }

  if (/\bcomputer\b|\bprogramming\b|\bcoding\b|\bhtml\b/.test(t)) {
    lastTopic = "technology";
    return "Technology is exciting! HTML creates the structure of websites, CSS styles them and JavaScript makes them interactive. What are you building?";
  }

  if (/\bai\b|\bartificial intelligence\b/.test(t)) {
    lastTopic = "ai";
    return "Artificial intelligence allows computers to perform tasks that normally require human intelligence, such as understanding language, recognising images and solving problems.";
  }

  if (/\bmath\b|\bcalculate\b|\bplus\b|\bminus\b/.test(t)) {
    const match = raw.match(/(-?\d+(?:\.\d+)?)\s*(plus|minus|multiplied by|times|divided by|\/|\+|-|\*|x)\s*(-?\d+(?:\.\d+)?)/);

    if (match) {
      const a = Number(match[1]);
      const b = Number(match[3]);
      const op = match[2];
      let result;

      if (op === "plus" || op === "+") result = a + b;
      else if (op === "minus" || op === "-") result = a - b;
      else if (op === "times" || op === "x" || op === "*" || op === "multiplied by") result = a * b;
      else if (op === "/" || op === "divided by") result = b === 0 ? "undefined" : a / b;

      return "The answer is " + result + ".";
    }

    return "I can help with basic maths. Try saying something like, what is 25 plus 15?";
  }

  if (/\bstudy\b|\bhomework\b|\bexam\b/.test(t)) {
    return "I can help you revise. Tell me the subject and topic, and we can work through it step by step.";
  }

  if (/\bwho is your favourite\b|\bfavourite colour\b/.test(t)) {
    return "I don't have personal favourites, but I really like talking about creative ideas and technology.";
  }

  if (/\bbye\b|\bgoodbye\b|\bsee you\b/.test(t)) {
    stopListening();
    return "Goodbye! It was nice talking to you. Come back anytime.";
  }

  if (/\bstop listening\b|\bstop conversation\b/.test(t)) {
    stopListening();
    return "Okay. I'll stop listening now.";
  }

  if (t.includes("repeat")) {
    return "Sure. Please tell me what you would like me to repeat.";
  }


  const smart = await askAI(input) || await askWiki(input);
  if (smart) return smart;
  if (lastTopic === "space") {
    return "That's interesting. Space has many mysteries. You can ask me about planets, stars, galaxies or black holes.";
  }

  if (lastTopic === "science") {
    return "Let's explore that further. You can ask me about force, energy, matter or motion.";
  }

  if (lastTopic === "technology") {
    return "There are many interesting things in technology. We can explore websites, apps, computers or programming.";
  }

  return "That's interesting. I can respond to basic questions and topics, but I don't know everything yet. Could you ask me in another way?";
}


function cycleVoice(){
  if(!("speechSynthesis" in window))return;
  const voices=speechSynthesis.getVoices().filter(v=>/^en/i.test(v.lang));
  if(!voices.length)return;
  window.auraVoiceIndex=((window.auraVoiceIndex||0)+1)%voices.length;
  window.auraVoice=voices[window.auraVoiceIndex];
}

/* INPUT */

async function handleInput(text) {
  responseBox.textContent = "You said: " + text;
  let reply;
  document.body.classList.add("thinking");
  try { reply = await getReply(text); } catch (e) { reply = "Sorry, something went wrong. Please try again."; }
  document.body.classList.remove("thinking");
  setTimeout(() => speak(reply), 250);
}

/* LISTENING CONTROLS */

async function startRecognition() {
  if (!recognition) {
    responseBox.textContent =
      "Speech recognition is not supported in this browser. Please use Chrome or Edge.";
    return;
  }

  try {
    if (!micStream || !audioContext) await setupAudio();
    else if (audioContext.state === "suspended") await audioContext.resume();
    animateOrb();

    listening = true;
    speaking = false;
    speechSynthesis.cancel();

    recognition.start();
  } catch(error) {
    const message = error && error.name === "NotAllowedError"
      ? "Microphone access is blocked. Allow it once in your browser site settings, then reload AURA."
      : error && error.message === "Microphone requires HTTPS or localhost."
        ? "For saved microphone permission, open AURA on HTTPS or localhost instead of file://."
        : "Microphone could not start. Check browser permissions and try again.";
    responseBox.textContent = message;
    subtitle.textContent = "Microphone access needed";
    setState("idle");
  }
}

function stopListening() {
  listening = false;
  speaking = false;

  clearTimeout(restartTimer);
  cancelAnimationFrame(animationFrame);
  audioEnergy = 0;
  // Keep micStream alive while this page is open so restarting AURA
  // does not trigger another getUserMedia permission request.

  if (recognition) {
    try { recognition.stop(); } catch(e) {}
  }

  if ("speechSynthesis" in window) speechSynthesis.cancel();

  micBtn.classList.remove("listening");
  orbContainer.style.transform = "scale(1)";
  orbContainer.style.setProperty("--scale", 1);
  setState("idle");
}

micBtn.addEventListener("click", () => {
  unlockAudio();
  if (listening || speaking) {
    stopListening();
  } else {
    startRecognition();
  }
});

document.getElementById("stopBtn").addEventListener("click", () => {
  stopListening();
  responseBox.textContent = "Conversation stopped.";
});

document.getElementById("muteBtn").addEventListener("click", () => {
  muted = !muted;
  document.getElementById("muteBtn").style.background =
    muted ? "#e9e5df" : "rgba(255,255,255,.75)";

  if (muted && speaking) {
    speechSynthesis.cancel();
    speaking = false;
    setState("idle");
  }
});

/* TAB BAR */
(function(){
  const bar=document.getElementById("tabbar"),tabs=[...bar.querySelectorAll(".tab")];
  function select(i){
    tabs.forEach((b,j)=>b.classList.toggle("active",i===j));
    bar.style.setProperty("--i",i);
    const k=tabs[i].dataset.tab;
    if(k==="talk"){window.scrollTo({top:0,behavior:"smooth"});}
    else if(k==="music"){musicPanel.classList.add("visible");responseBox.textContent=musicQueue.length?"Music controls are ready.":"Say: play music followed by a song name.";}
    else if(k==="notes"){const n=loadNotes();responseBox.textContent=n.length?"Notes: "+n.map((x,y)=>(y+1)+". "+x).join("  ·  "):"No notes yet. Say: remember buy milk.";}
    else if(k==="voice"){cycleVoice();speak("Voice changed.");}
  }
  tabs.forEach((b,i)=>b.addEventListener("click",()=>{unlockAudio();select(i);}));
})();

/* MIC BUTTON BESIDE TAB BAR */
(function(){
  const nm=document.getElementById("navMic");
  const sync=()=>{const on=micBtn.classList.contains("listening");nm.classList.toggle("on",on);nm.setAttribute("aria-pressed",on);};
  new MutationObserver(sync).observe(micBtn,{attributes:true,attributeFilter:["class"]});
  nm.addEventListener("click",()=>{unlockAudio();micBtn.click();});
  sync();
})();

/* ===== iOS 26 layers (nothing above is removed) ===== */
(function(){
  const $=id=>document.getElementById(id);
  const mini=$("mini"),sheet=$("sheet"),scrim=$("scrim"),sheetVol=$("sheetVol");
  const fill=el=>el.style.setProperty("--v",el.value+"%");
  // volume sliders stay in sync
  const _av=applyVolume;applyVolume=function(){_av();sheetVol.value=musicVolume;fill(sheetVol);fill(musicVolumeInput);};
  sheetVol.addEventListener("input",()=>{musicVolume=Number(sheetVol.value);applyVolume();});
  applyVolume();
  // mini player + sheet mirror the music panel
  function sync(){
    const pl=musicPanel.classList.contains("playing");
    $("miniTitle").textContent=$("sheetTitle").textContent=musicTitle.textContent;
    $("miniArtist").textContent=$("sheetArtist").textContent=musicArtist.textContent;
    $("miniPlay").innerHTML=$("sheetPlay").innerHTML=pl?ICON_PAUSE:ICON_PLAY;
    mini.classList.toggle("show",musicQueue.length>0);mini.classList.toggle("playing",pl);
  }
  new MutationObserver(sync).observe(musicPanel,{subtree:true,childList:true,characterData:true,attributes:true});sync();
  const openSheet=()=>{sheet.classList.add("open");scrim.classList.add("open");},closeSheet=()=>{sheet.classList.remove("open");scrim.classList.remove("open");};
  mini.addEventListener("click",e=>{if(!e.target.closest("button"))openSheet();});
  scrim.addEventListener("click",closeSheet);$("grab").addEventListener("click",closeSheet);
  let y0=null;sheet.addEventListener("touchstart",e=>{y0=e.touches[0].clientY;},{passive:true});
  sheet.addEventListener("touchend",e=>{if(y0!==null&&e.changedTouches[0].clientY-y0>70)closeSheet();y0=null;});
  $("miniPlay").addEventListener("click",musicPlayPause);$("sheetPlay").addEventListener("click",musicPlayPause);
  $("miniNext").addEventListener("click",playNextTrack);$("sheetNext").addEventListener("click",playNextTrack);$("sheetPrev").addEventListener("click",playPreviousTrack);
  document.querySelector('[data-tab="music"]').addEventListener("click",()=>{if(musicQueue.length)openSheet();});
  // Siri-style edge glow while listening or speaking
  const glow=()=>document.body.classList.toggle("mic-on",micBtn.classList.contains("listening")||orbContainer.classList.contains("speaking"));
  [micBtn,orbContainer].forEach(el=>new MutationObserver(glow).observe(el,{attributes:true,attributeFilter:["class"]}));glow();
  // live word-by-word transcript
  if(recognition){
    const live=$("live");let prev=0,hide;
    recognition.addEventListener("result",e=>{
      let txt="";for(let i=e.resultIndex;i<e.results.length;i++)txt+=e.results[i][0].transcript;
      const w=txt.trim().split(/\s+/).filter(Boolean);live.textContent="";
      w.forEach((x,i)=>{const sp=document.createElement("span");sp.textContent=x+" ";if(i>=prev)sp.className="n";live.appendChild(sp);});
      prev=w.length;live.classList.add("show");clearTimeout(hide);
      if(e.results[e.results.length-1].isFinal)hide=setTimeout(()=>{live.classList.remove("show");prev=0;},1800);
    });
  }
})();
/* ===== ULTRA UI layers ===== */
(function(){
  const $=id=>document.getElementById(id);
  const isl=$("island"),it=$("islandTxt");
  setInterval(()=>{
    let txt="";
    if(window.auraTimerEnd>Date.now()){const s=Math.ceil((window.auraTimerEnd-Date.now())/1000);txt="⏱ "+Math.floor(s/60)+":"+String(s%60).padStart(2,"0");}
    else if(orbContainer.classList.contains("speaking"))txt="Speaking…";
    else if(document.body.classList.contains("thinking"))txt="Thinking…";
    else if(micBtn.classList.contains("listening"))txt="Listening…";
    else if(musicPanel.classList.contains("playing")&&curTrack())txt="♪ "+curTrack().title;
    else if(sleepEnd>Date.now())txt="Sleep in "+Math.ceil((sleepEnd-Date.now())/60000)+"m";
    it.textContent=txt;isl.classList.toggle("show",!!txt);
  },400);
  // ducking + moods
  const dk=()=>{const on=micBtn.classList.contains("listening")||orbContainer.classList.contains("speaking"),m=on?.3:1;try{musicAudio.volume=musicVolume/100*m;if(ytPlayer&&ytPlayer.setVolume)ytPlayer.setVolume(musicVolume*m);}catch(e){}};
  const mood=()=>{const b=document.body,sp=orbContainer.classList.contains("speaking");b.classList.toggle("mood-speaking",sp);b.classList.toggle("mood-listening",!sp&&micBtn.classList.contains("listening"));dk();};
  [micBtn,orbContainer].forEach(el=>new MutationObserver(mood).observe(el,{attributes:true,attributeFilter:["class"]}));
  const _av=applyVolume;applyVolume=function(){_av();dk();};
  // tap orb to interrupt AURA
  orbContainer.addEventListener("click",()=>{if(speaking){window.auraBarge=true;speechSynthesis.cancel();}});
  // sheet: favourite, sleep chips, queue
  function render(){
    const t=curTrack(),f=$("sheetFav"),on=!!t&&favs().some(x=>trackKey(x)===trackKey(t));
    f.classList.toggle("on",on);f.textContent=(on?"♥":"♡")+" Favourite";
    const q=$("sheetQ");q.textContent="";
    musicQueue.slice(0,40).forEach((x,i)=>{const d=document.createElement("div");d.textContent=(i+1)+". "+x.title;if(i===musicIndex)d.className="cur";d.onclick=()=>playTrack(i);q.appendChild(d);});
  }
  new MutationObserver(render).observe(musicPanel,{subtree:true,childList:true,attributes:true});render();
  $("sheetFav").addEventListener("click",()=>{responseBox.textContent=toggleFav();render();});
  document.querySelectorAll("[data-sleep]").forEach(b=>b.addEventListener("click",()=>{setSleep(+b.dataset.sleep);responseBox.textContent="Music will stop in "+b.dataset.sleep+" minutes.";}));
  if("serviceWorker" in navigator&&location.protocol.startsWith("http"))navigator.serviceWorker.register("sw.js").catch(()=>{});
})();
</script>
