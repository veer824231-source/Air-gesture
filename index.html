<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NameDrop Direct Share</title>
    <style>
        :root {
            --bg: #000000;
            --card-bg: rgba(28, 28, 30, 0.8);
            --accent: #0A84FF;
            --success: #34C759;
            --text: #F5F5F7;
            --text-secondary: #8E8E93;
            --border: rgba(255, 255, 255, 0.12);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 40px 20px;
            overflow-x: hidden;
        }

        header {
            text-align: center;
            z-index: 10;
        }

        header h1 {
            font-size: 26px;
            font-weight: 600;
            letter-spacing: -0.5px;
            margin-bottom: 4px;
        }

        header p {
            font-size: 13px;
            color: var(--text-secondary);
        }

        /* Stage Layout for NameDrop Animation */
        .stage {
            position: relative;
            width: 100%;
            max-width: 500px;
            height: 380px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .phones-container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Apple NameDrop Flare Effect */
        .flare-glow {
            position: absolute;
            width: 180px;
            height: 180px;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.9) 0%, rgba(10, 132, 255, 0.5) 45%, transparent 75%);
            top: 25%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0);
            border-radius: 50%;
            pointer-events: none;
            z-index: 6;
            transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.6s ease;
            opacity: 0;
        }

        .phones-container.connected .flare-glow {
            transform: translate(-50%, -50%) scale(1.6);
            opacity: 1;
            animation: pulseFlare 2s infinite alternate;
        }

        @keyframes pulseFlare {
            0% { transform: translate(-50%, -50%) scale(1.5); opacity: 0.8; }
            100% { transform: translate(-50%, -50%) scale(1.8); opacity: 1; filter: drop-shadow(0 0 25px var(--accent)); }
        }

        /* Phone Mockups */
        .phone {
            position: absolute;
            width: 135px;
            height: 255px;
            background: #1c1c1e;
            border-radius: 26px;
            border: 4px solid #3a3a3c;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.7);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 10px 8px;
            transition: transform 0.9s cubic-bezier(0.16, 1, 0.3, 1), border-color 0.4s ease, box-shadow 0.4s ease;
        }

        .notch {
            width: 42px;
            height: 10px;
            background: #000;
            border-radius: 5px;
            margin-bottom: 10px;
        }

        .phone-screen {
            flex: 1;
            width: 100%;
            background: linear-gradient(145deg, #161618, #0a0a0c);
            border-radius: 14px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 8px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .phone.local {
            transform: translateY(15px) translateX(-75px) rotate(-7deg);
            z-index: 2;
        }

        .phone.remote {
            transform: translateY(15px) translateX(75px) rotate(7deg);
            z-index: 1;
        }

        /* Connected state: top-to-top snap */
        .phones-container.connected .phone.local {
            transform: translateY(-8px) translateX(-26px) rotate(-1.5deg) scale(1.03);
            border-color: var(--accent);
            box-shadow: 0 0 30px rgba(10, 132, 255, 0.5), 0 20px 40px rgba(0,0,0,0.8);
        }

        .phones-container.connected .phone.remote {
            transform: translateY(-8px) translateX(26px) rotate(1.5deg) scale(1.03);
            border-color: var(--accent);
            box-shadow: 0 0 30px rgba(10, 132, 255, 0.5), 0 20px 40px rgba(0,0,0,0.8);
        }

        /* Dashboard & Controls */
        .dashboard {
            width: 100%;
            max-width: 420px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            z-index: 10;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            padding: 16px;
            border-radius: 18px;
            backdrop-filter: blur(25px);
            text-align: center;
        }

        .drop-zone {
            border: 2px dashed rgba(255,255,255,0.2);
            border-radius: 14px;
            padding: 20px;
            transition: 0.2s;
            cursor: pointer;
        }

        .drop-zone:hover {
            border-color: var(--accent);
            background: rgba(10, 132, 255, 0.05);
        }

        .btn {
            background-color: var(--accent);
            color: #ffffff;
            border: none;
            padding: 14px 20px;
            border-radius: 14px;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            width: 100%;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn:hover { background-color: #0071e3; }
        .btn:disabled { background-color: #3a3a3c; color: var(--text-secondary); cursor: not-allowed; }

        input[type="file"] { display: none; }

        .status-text {
            font-size: 13px;
            color: var(--text-secondary);
            text-align: center;
            margin-top: 4px;
        }

        .stats-row {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: var(--text-secondary);
            margin-top: 8px;
        }

        progress {
            width: 100%;
            height: 8px;
            border-radius: 4px;
            appearance: none;
            margin-top: 8px;
            overflow: hidden;
        }

        progress::-webkit-progress-bar { background-color: #2c2c2e; }
        progress::-webkit-progress-value { background-color: var(--success); transition: width 0.1s linear; }

        svg { width: 18px; height: 18px; fill: currentColor; }
    </style>
</head>
<body>

    <header>
        <h1>NameDrop</h1>
        <p>Bring devices close to instantly share files</p>
    </header>

    <!-- Animation Stage -->
    <div class="stage">
        <div class="phones-container" id="phonesContainer">
            <div class="flare-glow"></div>

            <!-- Local Device -->
            <div class="phone local">
                <div class="notch"></div>
                <div class="phone-screen">
                    <svg style="width:26px;height:26px;fill:var(--accent);margin-bottom:6px;" viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 0 10 10A10 10 0 0 0 12 2zm0 18a8 8 0 1 1 8-8 8 8 0 0 1-8 8zm1-13h-2v6h6v-2h-4z"/></svg>
                    <div style="font-size:11px; font-weight:600;" id="localRole">My Device</div>
                    <div style="font-size:9px; color:var(--text-secondary); margin-top:2px;" id="localState">Searching...</div>
                </div>
            </div>

            <!-- Remote Peer Device -->
            <div class="phone remote">
                <div class="notch"></div>
                <div class="phone-screen">
                    <svg style="width:26px;height:26px;fill:var(--text-secondary);margin-bottom:6px;" viewBox="0 0 24 24"><path d="M17 1.01L7 1c-1.1 0-2 .9-2 2v18c0 1.1.9 2 2 2h10c1.1 0 2-.9 2-2V3c0-1.1-.9-1.99-2-1.99zM17 19H7V5h10v14z"/></svg>
                    <div style="font-size:11px; font-weight:600;">Nearby Device</div>
                    <div style="font-size:9px; color:var(--text-secondary); margin-top:2px;" id="remoteState">Waiting...</div>
                </div>
            </div>
        </div>
    </div>

    <!-- Dashboard Controls -->
    <div class="dashboard">
        <div class="card">
            <div class="drop-zone" id="dropZone">
                <svg style="width:32px;height:32px;fill:var(--accent);margin-bottom:8px;" viewBox="0 0 24 24"><path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96zM14 13v4h-4v-4H7l5-5 5 5h-3z"/></svg>
                <div style="font-size: 14px; font-weight: 500; margin-bottom: 4px;" id="dropText">Tap or Drop Files to Send</div>
                <div style="font-size: 11px; color: var(--text-secondary);">Direct P2P Wireless Transfer</div>
            </div>
            <input type="file" id="fileInput" multiple>
        </div>

        <div id="transferCard" class="card" style="display:none;">
            <div style="font-size: 13px; display:flex; justify-content:space-between; margin-bottom:4px;">
                <span id="fileNameDisplay" style="font-weight: 500; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:250px;">file.ext</span>
                <span id="filePercentage" style="color: var(--accent); font-weight:600;">0%</span>
            </div>
            <progress id="transferProgress" value="0" max="100"></progress>
            <div class="stats-row">
                <span id="transferSpeed">0 KB/s</span>
                <span id="transferETA">Calculating...</span>
            </div>
        </div>

        <div class="status-text" id="statusMessage">Scanning for nearby devices...</div>
    </div>

    <footer>
        <p style="font-size: 11px; color: var(--text-secondary);">Apple NameDrop UI Animation & WebRTC P2P</p>
    </footer>

    <script>
        // Automatic Global Pool Room (No manual code needed)
        const GLOBAL_ROOM = "namedrop-global-mesh-pool-998877";
        const ws = new WebSocket(`wss://socketsbay.com/wss/v2/1/demo/`);

        let pc, dataChannel;
        let isInitiator = false;
        let incomingMeta = {}, buffer = [], receivedBytes = 0;
        let startTime = 0;

        const configuration = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] };

        const phonesContainer = document.getElementById('phonesContainer');
        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('fileInput');
        const statusMessage = document.getElementById('statusMessage');
        const localState = document.getElementById('localState');
        const remoteState = document.getElementById('remoteState');
        const transferCard = document.getElementById('transferCard');
        const transferProgress = document.getElementById('transferProgress');
        const filePercentage = document.getElementById('filePercentage');
        const fileNameDisplay = document.getElementById('fileNameDisplay');
        const transferSpeed = document.getElementById('transferSpeed');
        const transferETA = document.getElementById('transferETA');

        ws.onopen = () => {
            ws.send(JSON.stringify({ type: 'join', room: GLOBAL_ROOM }));
            statusMessage.textContent = "Scanning for nearby devices...";
            
            // Automatic role coordination
            setTimeout(() => {
                isInitiator = true;
                document.getElementById('localRole').textContent = "Device A";
                initPeerConnection(true);
            }, 1200);
        };

        ws.onmessage = async (event) => {
            const message = JSON.parse(event.data);
            if (!pc) initPeerConnection(false);

            if (message.type === 'offer') {
                await pc.setRemoteDescription(new RTCSessionDescription(message.offer));
                const answer = await pc.createAnswer();
                await pc.setLocalDescription(answer);
                ws.send(JSON.stringify({ type: 'answer', answer: answer }));
            } else if (message.type === 'answer') {
                await pc.setRemoteDescription(new RTCSessionDescription(message.answer));
            } else if (message.type === 'candidate') {
                if (message.candidate) await pc.addIceCandidate(new RTCIceCandidate(message.candidate));
            }
        };

        function initPeerConnection(initiator) {
            pc = new RTCPeerConnection(configuration);

            pc.onicecandidate = (e) => {
                if (e.candidate) {
                    ws.send(JSON.stringify({ type: 'candidate', candidate: e.candidate }));
                }
            };

            if (initiator) {
                dataChannel = pc.createDataChannel("namedrop-transfer");
                setupDataChannel();
                pc.createOffer().then(offer => {
                    pc.setLocalDescription(offer);
                    ws.send(JSON.stringify({ type: 'offer', offer: offer }));
                });
            } else {
                pc.ondatachannel = (e) => {
                    dataChannel = e.channel;
                    setupDataChannel();
                };
            }
        }

        function setupDataChannel() {
            dataChannel.onopen = () => {
                // Trigger NameDrop Animation
                phonesContainer.classList.add('connected');
                statusMessage.textContent = "Devices Connected! Ready to share.";
                localState.textContent = "Connected";
                remoteState.textContent = "Connected";
                if (navigator.vibrate) navigator.vibrate(60);
            };

            dataChannel.onclose = () => {
                phonesContainer.classList.remove('connected');
                statusMessage.textContent = "Devices separated. Connection closed.";
                localState.textContent = "Disconnected";
                remoteState.textContent = "Disconnected";
            };

            dataChannel.onmessage = async (e) => {
                if (typeof e.data === 'string') {
                    incomingMeta = JSON.parse(e.data);
                    buffer = [];
                    receivedBytes = 0;
                    startTime = Date.now();
                    transferCard.style.display = 'block';
                    fileNameDisplay.textContent = incomingMeta.name;
                    statusMessage.textContent = `Receiving "${incomingMeta.name}"...`;
                } else {
                    buffer.push(e.data);
                    receivedBytes += e.data.byteLength;
                    
                    const elapsed = (Date.now() - startTime) / 1000;
                    const speed = elapsed > 0 ? receivedBytes / elapsed : 0;
                    const pct = Math.round((receivedBytes / incomingMeta.size) * 100);
                    
                    transferProgress.value = pct;
                    filePercentage.textContent = `${pct}%`;
                    transferSpeed.textContent = `${(speed / (1024*1024)).toFixed(2)} MB/s`;
                    
                    const remaining = incomingMeta.size - receivedBytes;
                    const eta = speed > 0 ? Math.ceil(remaining / speed) : 0;
                    transferETA.textContent = `ETA: ${eta}s`;

                    if (receivedBytes === incomingMeta.size) {
                        const blob = new Blob(buffer);
                        const url = URL.createObjectURL(blob);
                        const a = document.createElement('a');
                        a.href = url;
                        a.download = incomingMeta.name;
                        a.click();
                        statusMessage.textContent = `Successfully received "${incomingMeta.name}"! 🎉`;
                        if (navigator.vibrate) navigator.vibrate([100, 50, 100]);
                    }
                }
            };
        }

        // File Selection & Drag Drop
        dropZone.onclick = () => fileInput.click();
        
        dropZone.ondragover = (e) => { e.preventDefault(); dropZone.style.borderColor = "var(--accent)"; };
        dropZone.ondragleave = () => { dropZone.style.borderColor = "rgba(255,255,255,0.2)"; };
        dropZone.ondrop = (e) => {
            e.preventDefault();
            dropZone.style.borderColor = "rgba(255,255,255,0.2)";
            if (e.dataTransfer.files.length > 0) handleFileSend(e.dataTransfer.files[0]);
        };

        fileInput.onchange = (e) => {
            if (e.target.files.length > 0) handleFileSend(e.target.files[0]);
        };

        function handleFileSend(file) {
            if (!dataChannel || dataChannel.readyState !== 'open') {
                alert("Waiting for connection to establish!");
                return;
            }

            transferCard.style.display = 'block';
            fileNameDisplay.textContent = file.name;
            statusMessage.textContent = `Sending "${file.name}"...`;
            startTime = Date.now();

            dataChannel.send(JSON.stringify({ type: 'meta', name: file.name, size: file.size }));

            const chunkSize = 16384;
            const reader = new FileReader();
            let offset = 0;

            reader.onload = (e) => {
                dataChannel.send(e.target.result);
                offset += e.target.result.byteLength;

                const elapsed = (Date.now() - startTime) / 1000;
                const speed = elapsed > 0 ? offset / elapsed : 0;
                const pct = Math.round((offset / file.size) * 100);

                transferProgress.value = pct;
                filePercentage.textContent = `${pct}%`;
                transferSpeed.textContent = `${(speed / (1024*1024)).toFixed(2)} MB/s`;

                const remaining = file.size - offset;
                const eta = speed > 0 ? Math.ceil(remaining / speed) : 0;
                transferETA.textContent = `ETA: ${eta}s`;

                if (offset < file.size) {
                    readNext();
                } else {
                    statusMessage.textContent = `Successfully sent "${file.name}"! ✓`;
                    if (navigator.vibrate) navigator.vibrate([100, 50, 100]);
                }
            };

            function readNext() {
                const slice = file.slice(offset, offset + chunkSize);
                reader.readAsArrayBuffer(slice);
            }
            readNext();
        }
    </script>
</body>
</html>
